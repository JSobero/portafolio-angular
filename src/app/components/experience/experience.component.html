<section class="w-full">
  
  <div class="flex items-end gap-4 mb-10">
    <h3 class="text-2xl font-display font-bold text-white tracking-wide">
      Experiencia Laboral
    </h3>
    <div class="h-px bg-gradient-to-r from-neon/40 to-transparent flex-1 mb-2"></div>
  </div>

  <div class="relative space-y-8 md:space-y-12">
    
    <div class="absolute left-3 md:left-[19px] top-2 bottom-4 w-px bg-gradient-to-b from-gray-700 via-gray-800 to-transparent"></div>

    <ng-container *ngFor="let e of items; let i = index; let first = first">
      
      <div class="relative pl-10 md:pl-16 group">
        
        <div class="absolute left-0 md:left-2 top-2 w-6 h-6 flex items-center justify-center">
          
          <div *ngIf="first" class="absolute inset-0 rounded-full bg-neon/20 animate-ping"></div>
          <div class="w-3 h-3 rounded-full border-2 transition-colors duration-300 z-10 bg-bg-dark"
               [ngClass]="first ? 'border-neon bg-neon shadow-[0_0_10px_rgba(0,255,122,0.6)]' : 'border-gray-600 group-hover:border-neon'">
          </div>
        </div>

        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-baseline gap-1 mb-2">
          
          <div>
            <h4 class="text-xl font-bold text-white group-hover:text-neon transition-colors duration-300">
              {{ e.title }}
            </h4>
            <div class="text-base text-gray-400 font-medium flex items-center gap-2 mt-1">
              <span class="iconify" data-icon="heroicons:building-office-20-solid"></span>
              {{ e.company }}
            </div>
          </div>

          <div class="text-xs font-mono text-neon/80 bg-neon/5 border border-neon/10 px-3 py-1 rounded-full whitespace-nowrap mt-2 sm:mt-0">
            {{ e.period }}
          </div>
        </div>

        <div class="mt-3 text-sm text-muted leading-relaxed relative">
            <ul class="space-y-2">
              <li *ngFor="let b of e.bullets" class="flex items-start gap-3">
                <span class="text-neon mt-1.5 text-[10px]">➤</span>
                <span class="group-hover:text-gray-300 transition-colors">{{ b }}</span>
              </li>
            </ul>
        </div>

      </div>
    </ng-container>

  </div>
</section>
