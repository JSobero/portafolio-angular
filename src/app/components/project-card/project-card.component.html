<article class="card flex flex-col justify-between hover:scale-[1.01] transition-transform">
  <div>
    <h3 class="text-md font-semibold">{{ project.title }}</h3>
    <div class="text-xs text-muted mt-1">{{ project.tags.join(' / ') }}</div>
    <p class="text-sm mt-3 text-muted">{{ project.description }}</p>
    <div class="flex flex-wrap gap-2 mt-3">
      <span *ngFor="let t of project.tech" class="text-xs px-2 py-1 rounded-md border border-gray-700">{{ t }}</span>
    </div>
  </div>

  <div class="mt-4 flex gap-2">
    <a [href]="project.demoUrl" target="_blank" class="btn btn-primary">LIVE DEMO</a>
    <a [href]="project.repoUrl" target="_blank" class="btn">GITHUB REPO</a>
  </div>
</article>
